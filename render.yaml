# Render Blueprint: free-tier DEMO deployment of the API (temporary, before the AWS deploy of
# ADR-010). Demo data only — DEMO_MODE runs simulated calls/LLM, the dev mailbox and local
# (ephemeral) file storage. The web app stays on Vercel and forwards /api/v1/* here via
# NIVOMI_API_ORIGIN. Spec: https://render.com/docs/blueprint-spec
# The free Render Postgres expires 30 days after creation (https://render.com/docs/free):
# demo data only; move DATABASE_URL to a longer-lived database before then.
services:
  - name: nivomi-api
    type: web
    runtime: docker
    plan: free
    region: singapore
    branch: rishin
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - apps/api/**
        - packages/**
        - package.json
        - package-lock.json
        - tsconfig*.json
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: 'true'
      - key: LOG_LEVEL
        value: info
      # Behind Render's proxy; client IPs come from X-Forwarded-For.
      - key: TRUST_PROXY
        value: 'true'
      # Demo has no separate migration step: apply migrations on start.
      - key: DATABASE_AUTO_MIGRATE
        value: 'true'
      # Free Postgres plans allow few connections.
      - key: DATABASE_POOL_SIZE
        value: '5'
      # Private-network URL of the Render Postgres below; never leaves Render.
      - key: DATABASE_URL
        fromDatabase:
          name: nivomi-db
          property: connectionString
      # The Vercel site that serves the web app and forwards /api/v1/* here.
      - key: CORS_ALLOWED_ORIGINS
        value: https://nivomi-ai.vercel.app
      - key: APP_WEB_URL
        value: https://nivomi-ai.vercel.app
      # 256-bit random values generated by Render on first creation.
      - key: AUTH_JWT_SECRET
        generateValue: true
      - key: CREDENTIALS_ENCRYPTION_KEY
        generateValue: true

databases:
  - name: nivomi-db
    plan: free
    region: singapore
    databaseName: nivomi
    user: nivomi
    # Empty allow list: reachable only from Render's private network (the API), not the internet.
    ipAllowList: []
