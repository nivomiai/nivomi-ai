# Render Blueprint: free-tier DEMO deployment of the API (temporary, before the AWS deploy of
# ADR-010). Demo data only — DEMO_MODE runs simulated calls/LLM, the dev mailbox and local
# (ephemeral) file storage. The web app stays on Vercel and forwards /api/v1/* here via
# NIVOMI_API_ORIGIN. Spec: https://render.com/docs/blueprint-spec
services:
  - name: nivomi-api
    type: web
    runtime: docker
    plan: free
    region: singapore
    branch: rishin
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    buildFilter:
      include:
        - apps/api/**
        - packages/**
        - package.json
        - package-lock.json
        - tsconfig*.json
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: 'true'
      - key: LOG_LEVEL
        value: info
      # Behind Render's proxy; client IPs come from X-Forwarded-For.
      - key: TRUST_PROXY
        value: 'true'
      # Demo has no separate migration step: apply migrations on start.
      - key: DATABASE_AUTO_MIGRATE
        value: 'true'
      # Free Neon/Postgres tiers allow few connections.
      - key: DATABASE_POOL_SIZE
        value: '5'
      # Neon *direct* (non-pooled) connection string, with ?sslmode=require. Entered in the
      # Render dashboard, never committed.
      - key: DATABASE_URL
        sync: false
      # The Vercel site, e.g. https://nivomi-ai.vercel.app (no trailing slash).
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: APP_WEB_URL
        sync: false
      # 256-bit random values generated by Render on first creation.
      - key: AUTH_JWT_SECRET
        generateValue: true
      - key: CREDENTIALS_ENCRYPTION_KEY
        generateValue: true
