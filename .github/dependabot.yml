version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    target-branch: development
    groups:
      # Minor and patch updates arrive as one weekly PR; majors stay separate
      # so each gets its own review (CLAUDE.md: no uncontrolled upgrades).
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: development
